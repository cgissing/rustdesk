name: Build Custom Windows Packages

on:
  workflow_dispatch:
    inputs:
      rustdesk_ref:
        description: "Fork branch, tag, or SHA to build"
        required: false
        default: ""
      custom_update_repo:
        description: "Repository used by private update checks, owner/repo"
        required: false
        default: "cgissing/rustdesk"
      publish_release:
        description: "Upload signed install.exe and .msi packages to a GitHub release"
        required: false
        type: boolean
        default: true
  push:
    branches:
      - no-auto-api-server-probe
      - custom-*

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  RUSTDESK_CUSTOM_UPDATE_REPO: ${{ inputs.custom_update_repo || 'cgissing/rustdesk' }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      rustdesk_ref: ${{ inputs.rustdesk_ref || github.ref }}

  build-windows-x64:
    name: build windows x64 packages
    needs: generate-bridge
    runs-on: windows-2022

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rustdesk_ref || github.ref }}
          submodules: recursive

      - name: Apply custom API-server patch
        shell: pwsh
        run: .\scripts\custom-build\apply-no-auto-api-probe.ps1

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with RustDesk custom Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $enginePath = "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release"
          Copy-Item -Path "windows-x64-release/*" -Destination $enginePath -Recurse -Force

      - name: Patch Flutter
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$flutter_root"
          cd "$flutter_root"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-custom

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r log_file; do
              echo "$log_file:"
              echo "======"
              cat "$log_file"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Run API server regression tests
        shell: bash
        run: cargo test --lib test_get_api_server

      - name: Prepare package version
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path .\Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path .\package-output | Out-Null
          Get-Item .\package-output | Format-List FullName

      - name: Build RustDesk Windows binaries
        shell: pwsh
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          if (Test-Path .\rustdesk) {
            Remove-Item .\rustdesk -Recurse -Force
          }
          Move-Item .\flutter\build\windows\x64\runner\Release .\rustdesk
          Get-ChildItem .\rustdesk\rustdesk.exe | Format-List FullName,Length

      - name: Prepare signing inputs
        shell: pwsh
        env:
          CUSTOM_WINDOWS_PFX_BASE64: ${{ secrets.CUSTOM_WINDOWS_PFX_BASE64 }}
        run: |
          $windowsKits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $windowsKits -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found under $windowsKits"
          }
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using signtool: $($signtool.FullName)"
          if (-not [string]::IsNullOrWhiteSpace($env:CUSTOM_WINDOWS_PFX_BASE64)) {
            [System.IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CUSTOM_WINDOWS_PFX_BASE64))
            Write-Host "Prepared cert.pfx for signing."
          } else {
            Write-Host "CUSTOM_WINDOWS_PFX_BASE64 is not set; package signing will be skipped."
          }

      - name: Sign Windows binaries
        shell: pwsh
        env:
          CUSTOM_WINDOWS_PFX_PASSWORD: ${{ secrets.CUSTOM_WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not (Test-Path .\cert.pfx)) {
            Write-Host "CUSTOM_WINDOWS_PFX_BASE64 is not set; skipping Authenticode signing."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:CUSTOM_WINDOWS_PFX_PASSWORD)) {
            throw "CUSTOM_WINDOWS_PFX_PASSWORD must be set when CUSTOM_WINDOWS_PFX_BASE64 is set."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNTOOL_PATH) -or -not (Test-Path $env:SIGNTOOL_PATH)) {
            throw "SIGNTOOL_PATH is not available."
          }
          $files = Get-ChildItem .\rustdesk -Recurse -Include *.exe,*.dll
          foreach ($file in $files) {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:CUSTOM_WINDOWS_PFX_PASSWORD $file.FullName
          }
          Get-AuthenticodeSignature .\rustdesk\rustdesk.exe | Format-List

      - name: Build self-extracted installer
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mv ./target/release/rustdesk-portable-packer.exe ./package-output/rustdesk-${{ env.VERSION }}-install.exe
          ls -l ./package-output/rustdesk-${{ env.VERSION }}-install.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build MSI installer
        shell: pwsh
        run: |
          Push-Location .\res\msi
          python .\preprocess.py --arp -d ..\..\rustdesk
          nuget restore .\msi.sln
          msbuild .\msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          Move-Item .\Package\bin\x64\Release\en-us\Package.msi "..\..\package-output\rustdesk-${env:VERSION}-x64.msi" -Force
          Pop-Location
          Get-Item ".\package-output\rustdesk-${env:VERSION}-x64.msi" | Format-List FullName,Length

      - name: Sign installer packages
        shell: pwsh
        env:
          CUSTOM_WINDOWS_PFX_PASSWORD: ${{ secrets.CUSTOM_WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not (Test-Path .\cert.pfx)) {
            Write-Host "CUSTOM_WINDOWS_PFX_BASE64 is not set; skipping installer signing."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:CUSTOM_WINDOWS_PFX_PASSWORD)) {
            throw "CUSTOM_WINDOWS_PFX_PASSWORD must be set when CUSTOM_WINDOWS_PFX_BASE64 is set."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNTOOL_PATH) -or -not (Test-Path $env:SIGNTOOL_PATH)) {
            throw "SIGNTOOL_PATH is not available."
          }
          $packages = Get-ChildItem .\package-output -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          foreach ($package in $packages) {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:CUSTOM_WINDOWS_PFX_PASSWORD $package.FullName
            Get-AuthenticodeSignature $package.FullName | Format-List
          }
          Get-ChildItem .\package-output | Format-List FullName,Length

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-windows-x64
          path: |
            rustdesk/**
            package-output/*.exe
            package-output/*.msi

      - name: Publish private release assets
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: RustDesk custom ${{ steps.package.outputs.version }}
          body: |
            Custom cgissing build with automatic API-server derivation/probe from custom rendezvous servers disabled.

            Source commit: ${{ github.sha }}
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            package-output/*.exe
            package-output/*.msi

      - name: Clean signing certificate
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path .\cert.pfx) {
            Remove-Item .\cert.pfx -Force
          }
